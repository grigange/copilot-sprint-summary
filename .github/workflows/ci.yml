name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Compile TypeScript
      run: npm run compile
    
    - name: Run tests
      run: xvfb-run -a npm test
    
    - name: Package extension
      if: matrix.node-version == '20.x'
      run: |
        VERSION=$(node -p "require('./package.json').version")
        npx @vscode/vsce package -o "copilot-sprint-summary-$VERSION.vsix"
    
    - name: Upload VSIX artifact
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: vsix
        path: 'copilot-sprint-summary-*.vsix'
        retention-days: 30

    - name: Upload VSIX to GitHub Release
      if: github.event_name == 'release' && matrix.node-version == '20.x'
      uses: softprops/action-gh-release@v1
      with:
        files: 'copilot-sprint-summary-*.vsix'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to VS Code Marketplace
      if: github.event_name == 'release' && !github.event.release.prerelease && matrix.node-version == '20.x'
      run: npx @vscode/vsce publish
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}